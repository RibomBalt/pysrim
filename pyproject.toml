[project]
name = "pysrim"
version = "0.2.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "docopt>=0.6.2",
    "matplotlib>=3.10.8",
    "mpi4py>=4.1.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

keywords = [
    "material",
    "srim",
    "automation",
    "plotting",
    "scientific",
    "simulation"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13", # 添加对 Python 3.13 的支持
    "License :: OSI Approved :: MIT License", # 假设是MIT协议
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Development Status :: 4 - Beta", # 或其他状态
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srim*"]
exclude = ["vendor*", "tmp*", "tests*", "example*", "output*"]

[tool.setuptools.package-data]
srim = ["data/*.yaml", "data/*.bin", "data/*.BIN"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "srim: 需要可用的 SRIM 安装才能运行（缺少时整体跳过）",
    "slow: 真实调用 TRIM.exe 的集成测试",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "tmp", "output", "example"]

[tool.ruff.lint]
# 只启用“确定性错误”规则：语法错误与未定义名等，不引入大规模风格改写
select = ["E4", "E7", "E9", "F"]
